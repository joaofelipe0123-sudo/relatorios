name: Gerar APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Preparar assinatura
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/assinatura.keystore"
            echo "KS_PASS=$KEYSTORE_PASS" >> "$GITHUB_ENV"
          else
            SENHA=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$RUNNER_TEMP/assinatura.keystore" -alias jfgiralde \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass "$SENHA" -keypass "$SENHA" \
              -dname "CN=JFGiralde iA Softwares, O=JFGiralde iA, C=BR"
            echo "::add-mask::$SENHA"
            echo "KS_PASS=$SENHA" >> "$GITHUB_ENV"
          fi
          echo "KS_FILE=$RUNNER_TEMP/assinatura.keystore" >> "$GITHUB_ENV"
      - name: Compilar APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Publicar APK no site
        run: |
          mkdir -p download
          cp android/app/build/outputs/apk/release/app-release.apk download/Relatorios-JFGiralde.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download/Relatorios-JFGiralde.apk
          git commit -m "APK gerado automaticamente [skip ci]" || echo "sem mudanças"
          git pull --rebase
          git push
